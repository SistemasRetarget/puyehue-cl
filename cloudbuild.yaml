steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/puyehue/puyehue-web:latest'
      - '--build-arg'
      - 'PAYLOAD_SECRET=puyehue-secret-change-me'
      - '--build-arg'
      - 'DATABASE_URL=file:./payload.db'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=https://puyehue-web-270024878418.europe-west1.run.app'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/puyehue/puyehue-web:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'puyehue-web'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/puyehue/puyehue-web:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production,PORT=8080'
      - '--update-secrets=PAYLOAD_SECRET=puyehue-payload-secret:latest,DATABASE_URL=puyehue-db-url:latest'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/puyehue/puyehue-web:latest'
